name: Tests and distributions

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-test.lock
      - run: python -m pip install --no-build-isolation -e .
      - run: python -m pytest -m 'not integration'
      - run: python -m build --no-isolation
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Installed command smoke test outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          basic-assemble --version
          basic-references --help
          basic-skill --print
          python -c "from basic_assembler.pipeline import default_database_path; from basic_assembler.alignment import validate_indexes; validate_indexes(default_database_path() / 'human' / 'BCR')"
  biological-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.lock
      - run: python -m pip install --no-build-isolation -e .
      - name: Install pinned Bowtie2
        run: |
          curl -L --fail https://github.com/BenLangmead/bowtie2/releases/download/v2.5.5/bowtie2-2.5.5-linux-x86_64.zip -o "$RUNNER_TEMP/bowtie2.zip"
          unzip -q "$RUNNER_TEMP/bowtie2.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/bowtie2-2.5.5-linux-x86_64" >> "$GITHUB_PATH"
      - run: python -m pytest -m integration
      - run: python benchmarks/overlap_benchmark.py --help
